<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安,你好ANNEHO - 線上預約系統</title>
  <style>
    :root {
      --bg-main: #FBF8F3;
      --card-bg: #FFFFFF;
      --text-main: #3D2E24;
      --text-sub: #8C7C73;
      --primary-color: #4A3B32;
      --primary-hover: #362A23;
      --accent-color: #D4B28C;
      --border-color: #EFE8DF;
      --input-bg: #FAF6F0;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 15px rgba(74, 59, 50, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
    .app-container { width: 100%; max-width: 480px; background: var(--bg-main); min-height: 100vh; position: relative; padding-bottom: 90px; }
    .header { text-align: center; padding: 20px 0 10px; cursor: pointer; user-select: none; }
    .header h1 { font-size: 22px; color: var(--primary-color); letter-spacing: 2px; }
    .header p { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
    .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center; }
    .item-option { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1.5px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .item-option.selected { border-color: var(--primary-color); background-color: #F8F3EC; }
    .item-info .title { font-size: 14px; font-weight: 600; }
    .item-info .subtitle { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .item-price { font-weight: 600; color: var(--primary-color); font-size: 14px; }
    
    /* 日曆樣式 */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-btn { background: none; border: none; font-size: 16px; color: var(--primary-color); cursor: pointer; padding: 4px 8px; font-weight: bold; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 13px; }
    .cal-day-label { font-weight: 600; color: var(--text-sub); padding-bottom: 6px; }
    .cal-day { padding: 10px 0; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; background: var(--input-bg); }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.selected { background: var(--primary-color); color: #fff; font-weight: bold; }
    .cal-day.disabled { opacity: 0.3; cursor: not-allowed; }
    
    /* 時段樣式 */
    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .time-btn { padding: 10px; border: 1.5px solid var(--border-color); border-radius: var(--radius-md); background: #fff; text-align: center; font-size: 13px; cursor: pointer; color: var(--text-main); }
    .time-btn.selected { border-color: var(--primary-color); background: var(--primary-color); color: #fff; }
    .time-btn.disabled { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }

    /* 表單元件 */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
    .form-input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--input-bg); font-size: 14px; outline: none; }
    .form-input:focus { border-color: var(--primary-color); }

    /* 底部固定欄 */
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--card-bg); border-top: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
    .price-summary { font-size: 12px; color: var(--text-sub); }
    .price-summary .total { font-size: 16px; font-weight: bold; color: var(--primary-color); }
    .btn-submit { background: var(--primary-color); color: #fff; border: none; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 店家頁面特有 */
    .admin-bar { background: var(--primary-color); color: #fff; padding: 10px 16px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .admin-tab-group { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .admin-tab { padding: 8px 14px; background: #fff; border: 1px solid var(--border-color); border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .admin-tab.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    .btn-danger { background: #D9534F; color: white; border: none; padding: 6px 10px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; }
    .btn-secondary { background: #EFE8DF; color: var(--primary-color); border: none; padding: 8px 12px; border-radius: var(--radius-md); font-size: 12px; cursor: pointer; }

    /* Modal 視窗 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; border-radius: var(--radius-lg); padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 頂部 Header -->
  <div class="header" onclick="handleHeaderClick()">
    <h1 id="shopTitle">安,你好ANNEHO</h1>
    <p id="shopSubTitle">線上預約系統</p>
  </div>

  <!-- 店家管理模式頂部資訊 (預設隱藏) -->
  <div id="adminHeader" style="display: none;">
    <div class="admin-bar">
      <span>👑 店家管理後台</span>
      <button class="btn-secondary" onclick="switchView('client')">👁️ 預覽顧客頁面</button>
    </div>
    <div class="admin-tab-group">
      <div class="admin-tab active" onclick="switchAdminTab('services')">服務項目</div>
      <div class="admin-tab" onclick="switchAdminTab('schedule')">月曆排班</div>
      <div class="admin-tab" onclick="switchAdminTab('orders')">預約紀錄</div>
      <div class="admin-tab" onclick="switchAdminTab('settings')">轉帳/店家設定</div>
    </div>
  </div>

  <!-- ==================== 顧客頁面 ==================== -->
  <div id="clientView">
    <!-- 主服務 -->
    <div class="card">
      <div class="card-title">選擇主服務項目</div>
      <div id="clientServicesList"></div>
    </div>

    <!-- 加購項目 -->
    <div class="card">
      <div class="card-title">加購項目</div>
      <div id="clientAddonsList"></div>
    </div>

    <!-- 月曆選擇 -->
    <div class="card">
      <div class="card-title">選擇日期與時段</div>
      <div class="cal-header">
        <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
        <span id="calMonthTitle" style="font-weight: bold; font-size: 14px;"></span>
        <button class="cal-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      
      <div style="margin-top: 16px; font-size: 13px; font-weight: 600;" id="selectedDateText">請選擇日期</div>
      <div class="time-grid" id="timeGrid"></div>
    </div>

    <!-- 顧客基本資料 -->
    <div class="card">
      <div class="card-title">填寫預約資料</div>
      <div class="form-group">
        <label>您的姓名 *</label>
        <input type="text" id="custName" class="form-input" placeholder="請輸入姓名">
      </div>
      <div class="form-group">
        <label>聯絡電話 *</label>
        <input type="tel" id="custPhone" class="form-input" placeholder="請輸入手機號碼">
      </div>
      <div class="form-group">
        <label>備註事項</label>
        <input type="text" id="custNote" class="form-input" placeholder="例如：款式需求、有無卸甲/美睫">
      </div>
    </div>

    <!-- 底部固定預約按鈕 -->
    <div class="bottom-bar">
      <div class="price-summary">
        <div>訂金合計：<span class="total" id="displayDeposit">NT$ 0</span></div>
        <div style="font-size: 11px; margin-top: 2px;" id="displayTotal">總計：NT$ 0</div>
      </div>
      <button class="btn-submit" id="btnGoPay" onclick="openPayModal()" disabled>下一步：付款與確認</button>
    </div>
  </div>

  <!-- ==================== 後台頁面 ==================== -->
  <div id="adminView" style="display: none;">
    <!-- 1. 服務項目管理 -->
    <div id="adminTabServices" class="admin-tab-content">
      <div class="card">
        <div class="card-title">
          <span>主服務清單</span>
          <button class="btn-secondary" onclick="openAddServiceModal('main')">+ 新增服務</button>
        </div>
        <div id="adminMainServicesList"></div>
      </div>
      <div class="card">
        <div class="card-title">
          <span>加購項目清單</span>
          <button class="btn-secondary" onclick="openAddServiceModal('addon')">+ 新增加購</button>
        </div>
        <div id="adminAddonServicesList"></div>
      </div>
    </div>

    <!-- 2. 月曆排班與時段管理 -->
    <div id="adminTabSchedule" class="admin-tab-content" style="display: none;">
      <div class="card">
        <div class="card-title">設定日期與開放時段</div>
        <div class="cal-header">
          <button class="cal-btn" onclick="changeAdminMonth(-1)">‹</button>
          <span id="adminCalMonthTitle" style="font-weight: bold;"></span>
          <button class="cal-btn" onclick="changeAdminMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="adminCalGrid"></div>
        
        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">
        <div id="adminDateScheduleArea" style="display: none;">
          <div style="font-weight: bold; margin-bottom: 8px;" id="adminSelectedDateTitle"></div>
          <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="time" id="newTimeInput" class="form-input" style="width: 60%;" value="10:00">
            <button class="btn-submit" style="border-radius: var(--radius-md); padding: 0 16px;" onclick="addCustomTime()">新增時段</button>
          </div>
          <div id="adminTimeSlotsList"></div>
        </div>
      </div>
    </div>

    <!-- 3. 預約紀錄管理 -->
    <div id="adminTabOrders" class="admin-tab-content" style="display: none;">
      <div class="card">
        <div class="card-title">收到預約總覽</div>
        <div id="adminOrdersList"></div>
      </div>
    </div>

    <!-- 4. 店家與轉帳設定 -->
    <div id="adminTabSettings" class="admin-tab-content" style="display: none;">
      <div class="card">
        <div class="card-title">轉帳銀行資訊</div>
        <div class="form-group">
          <label>銀行代碼 (如 808)</label>
          <input type="text" id="settingBankCode" class="form-input">
        </div>
        <div class="form-group">
          <label>銀行名稱 (如 玉山銀行)</label>
          <input type="text" id="settingBankName" class="form-input">
        </div>
        <div class="form-group">
          <label>轉帳帳號</label>
          <input type="text" id="settingBankAcc" class="form-input">
        </div>
        <div class="form-group">
          <label>戶名</label>
          <input type="text" id="settingBankHolder" class="form-input">
        </div>
        <div class
