<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安,你好ANNEHO - 線上預約系統</title>
    <style>
        :root {
            --bg-main: #FBF8F3;
            --card-bg: #FFFFFF;
            --text-main: #3D2E24;
            --text-sub: #8C7C73;
            --primary-color: #4A3B32;
            --primary-hover: #362A23;
            --accent-color: #D4B28C;
            --border-color: #EFE8DF;
            --input-bg: #FAF6F0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 15px rgba(74, 59, 50, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-main);
            min-height: 100vh;
            position: relative;
            padding-bottom: 70px;
        }

        header {
            background-color: var(--bg-main);
            padding: 20px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .view-section {
            display: none;
            padding: 0 16px 20px 16px;
        }

        .view-section.active {
            display: block;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 16px 0 10px 0;
            color: var(--primary-color);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .item-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-card.selected {
            border-color: var(--primary-color);
            background-color: #F5EFEB;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .item-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .item-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
